name: Transform JSON

on:
  schedule:
    - cron: '0 */3 * * 0,5,6'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transform-json
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run transformation script
        run: uv run --with requests --with gitpython python transform_schedule.py

      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add <output-file>.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update schedule"
            git pull --rebase
            git push
          fi
